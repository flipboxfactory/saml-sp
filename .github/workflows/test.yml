# GitHub Action for Craft CMS
name: test
on:
  push:
  pull_request:
  schedule:
    # every tuesday
    - cron:  '0 0 * * 3'

jobs:
  craft:
    name: Craft CMS (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    env:
      DB_USER: root
      DB_DATABASE: test
      DB_SERVER: 127.0.0.1
      DB_PASSWORD: password
      DB_CHARSET: utf8
      # Test-only key; controller tests need cookie validation
      CRAFT_SECURITY_KEY: saml-sp-test-security-key
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: false
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        php-versions:
          - '8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Set Node.js 10.x
      #   uses: actions/setup-node@v1
      #   with:
      #     node-version: 10.x
      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, gd, imagick, zip, dom, mysql
          coverage: xdebug #optional
      # Craft 4.18.x pins dependencies (twig ~3.19.0, enshrined/svg-sanitize ~0.22.0, ...) that have
      # published advisories, so Composer 2.9+ refuses to install any Craft 4 release by default.
      # CI only: allow the install (same as Composer 2.8), then report the advisories below.
      - name: Allow installing Craft 4 dependencies with advisories (CI only)
        run: composer config policy.advisories.block false
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
      - name: Report dependency advisories
        continue-on-error: true
        run: composer audit
      - name: Run Tests
        run: |
          php ./vendor/bin/codecept build
          php ./vendor/bin/codecept run -vv --coverage --coverage-xml
        env:
          DB_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports['3306'] }};dbname=test
      - name: codecov.io
        # only do this once
        if: ${{ matrix.php-versions == '7.4' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: bash <(curl -s https://codecov.io/bash)

  # Releases from the conventional-commit PR titles merged since the latest 4.x tag (see .github/scripts/version.sh).
  # The release commit and tag are pushed by the release GitHub App.
  release:
    name: Tag & release
    if: github.event_name == 'push' && github.ref == 'refs/heads/craft/4.0'
    needs: [craft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/version.sh plan
      - name: Get a release app token
        id: app
        if: steps.plan.outputs.version != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit, tag and release ${{ steps.plan.outputs.version }}
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: .github/scripts/version.sh release "${{ steps.plan.outputs.version }}"
