name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master run: it may be creating a release
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, intl, mbstring, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: ECS
        run: composer check-cs
      - name: PHPStan
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saml_sp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CRAFT_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=saml_sp_test
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, openssl, pdo_mysql, zip
          tools: composer:v2
          # Coverage is measured once, on 8.3
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Show resolved saml-core / saml2 versions
        run: |
          composer show flipboxfactory/saml-core | grep -E '^versions'
          composer show simplesamlphp/saml2 | grep -E '^versions'
      - name: Run tests
        if: matrix.php != '8.3'
        run: |
          cp tests/.env.example tests/.env
          composer test
      - name: Run tests with coverage (minimum 85%)
        if: matrix.php == '8.3'
        run: |
          cp tests/.env.example tests/.env
          composer test-coverage
          php .github/scripts/coverage-check.php tests/_output/coverage.xml 85

  version:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and CHANGELOG
        run: .github/scripts/version.sh check "${{ github.event.pull_request.base.sha }}"

  release:
    name: Tag & release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and GitHub release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/version.sh release
