name: ci

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, to catch breaking saml-core / saml2 / Craft releases between PRs
    - cron: '0 0 * * 3'

permissions:
  contents: read

concurrency:
  # PRs share a group per branch so new pushes cancel old runs. Every other run gets its own group:
  # a shared group would cancel a *pending* master run when a newer one queues (even with
  # cancel-in-progress false), and that run's release would never be created.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Coding standards & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, intl, mbstring, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
      - name: ECS
        run: composer check-cs
      - name: PHPStan
        run: composer phpstan

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: saml_sp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CRAFT_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=saml_sp_test
      CRAFT_DB_USER: root
      CRAFT_DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, openssl, pdo_mysql, zip
          tools: composer:v2
          # Coverage is measured once, on 8.3
          coverage: ${{ matrix.php == '8.3' && 'pcov' || 'none' }}
      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
      - name: Show resolved saml-core / saml2 versions
        run: |
          composer show flipboxfactory/saml-core | grep -E '^versions'
          composer show simplesamlphp/saml2 | grep -E '^versions'
      - name: Run tests
        if: matrix.php != '8.3'
        run: |
          cp tests/.env.example tests/.env
          composer test
      - name: Run tests with coverage (minimum 85%)
        if: matrix.php == '8.3'
        run: |
          cp tests/.env.example tests/.env
          composer test-coverage
          php .github/scripts/coverage-check.php tests/_output/coverage.xml 85

  # Releases from the conventional-commit PR titles merged since the latest tag (see .github/scripts/version.sh).
  # The release commit is pushed by the release GitHub App, which may bypass the master ruleset.
  release:
    name: Tag & release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the next version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/version.sh plan
      - name: Get a release app token
        id: app
        if: steps.plan.outputs.version != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit, tag and release ${{ steps.plan.outputs.version }}
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: .github/scripts/version.sh release "${{ steps.plan.outputs.version }}"
