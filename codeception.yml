actor_suffix: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
bootstrap: _bootstrap.php
params:
    - tests/.env
    - env
settings:
    colors: true
    memory_limit: 1024M
coverage:
    enabled: true
    show_uncovered: true
    include:
        - src/*
    exclude:
        - src/templates/*
        - src/migrations/*
        - src/web/assets/*/dist/*
        - src/icon.svg
        - src/icon-mask.svg
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'http://localhost/index.php'
            projectConfig: {}
            migrations: []
            plugins:
                - class: '\flipbox\keychain\KeyChain'
                  handle: keychain
                - class: '\flipbox\saml\sp\Saml'
                  handle: saml-sp
            cleanup: true
            transaction: true
            dbSetup: { clean: true, setupCraft: true }
